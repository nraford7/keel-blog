<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breathing Grid — Keel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #060a10; width: 100%; height: 100%; cursor: crosshair; }
  canvas { display: block; }
  .waterline {
    position: fixed; top: 0; left: 0; width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent 0%, #2dd4bf 20%, #5eead4 50%, #2dd4bf 80%, transparent 100%);
    opacity: 0.6; z-index: 10;
  }
  .waterline-glow {
    position: fixed; top: 0; left: 0; width: 100%; height: 6px;
    background: linear-gradient(90deg, transparent 0%, #2dd4bf 20%, #5eead4 50%, #2dd4bf 80%, transparent 100%);
    opacity: 0.15; filter: blur(4px); z-index: 9;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<div class="waterline"></div>
<div class="waterline-glow"></div>
<script>
// ── Breathing Grid ──────────────────────────────────────────────────
// Kuramoto oscillator field. Cells breathe between synchronization
// (centralization) and fragmentation (distribution). Mouse creates
// a zone of forced order. Click sends a radial pulse.

const COL_BG     = [6, 10, 16];
const COL_DIM    = [61, 76, 94];
const COL_BIO    = [45, 212, 191];
const COL_BRIGHT = [94, 234, 212];
const COL_AMBER  = [212, 165, 116];

const CELL_SIZE = 28;

// Dynamics
const FREQ_MIN        = 0.006;
const FREQ_MAX        = 0.028;
const COUPLING_BASE   = 0.012;
const MOUSE_RADIUS    = 250;
const MOUSE_ATTRACT   = 0.06;   // direct phase attraction toward target
const MOUSE_COUPLING  = 0.12;   // extra neighbor coupling near mouse
const NOISE_STRENGTH  = 0.004;
const CYCLE_SPEED     = 0.0003;
const COUPLING_MIN    = 0.3;
const COUPLING_MAX    = 1.8;

let cols, rows, cellW, cellH;
let phases, freqs, offsets;
let globalTime = 0;
let smoothMX = -9999, smoothMY = -9999;
let mouseActive = false, lastMouseMove = 0;
let glowBuffer;

// Pulse system — click sends a ring outward
let pulses = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  colorMode(RGB, 255);
  noStroke();
  glowBuffer = createGraphics(windowWidth, windowHeight);
  glowBuffer.pixelDensity(1);
  glowBuffer.noStroke();
  initGrid();
}

function initGrid() {
  let cs = CELL_SIZE;
  if (width < 600) cs = 20;
  else if (width < 900) cs = 24;

  cols = Math.ceil(width / cs) + 2;
  rows = Math.ceil(height / cs) + 2;
  cellW = width / (cols - 2);
  cellH = height / (rows - 2);

  phases = []; freqs = []; offsets = [];
  for (let i = 0; i < cols; i++) {
    phases[i] = []; freqs[i] = []; offsets[i] = [];
    for (let j = 0; j < rows; j++) {
      // Random initial phases — no spatial correlation, starts chaotic
      phases[i][j]  = Math.random() * Math.PI * 2;
      freqs[i][j]   = FREQ_MIN + Math.random() * (FREQ_MAX - FREQ_MIN);
      offsets[i][j]  = Math.random();
    }
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  glowBuffer.resizeCanvas(windowWidth, windowHeight);
  initGrid();
}

function mouseMoved()  { mouseActive = true; lastMouseMove = frameCount; }
function touchMoved()  { mouseActive = true; lastMouseMove = frameCount; return false; }

function mousePressed() {
  pulses.push({ x: mouseX, y: mouseY, radius: 0, strength: 1 });
}

function touchStarted() {
  if (touches.length > 0) {
    pulses.push({ x: touches[0].x, y: touches[0].y, radius: 0, strength: 1 });
  }
  return false;
}

function draw() {
  background(COL_BG[0], COL_BG[1], COL_BG[2]);
  globalTime++;

  if (frameCount - lastMouseMove > 90) mouseActive = false;

  // Smooth mouse
  if (mouseActive) {
    smoothMX += (mouseX - smoothMX) * 0.12;
    smoothMY += (mouseY - smoothMY) * 0.12;
  } else {
    smoothMX += (-999 - smoothMX) * 0.015;
    smoothMY += (-999 - smoothMY) * 0.015;
  }

  // Update pulses
  for (let p = pulses.length - 1; p >= 0; p--) {
    pulses[p].radius += 6;
    pulses[p].strength *= 0.97;
    if (pulses[p].strength < 0.01) pulses.splice(p, 1);
  }

  // Global breath
  let bp = globalTime * CYCLE_SPEED;
  let rawBreath = Math.sin(bp) * 0.6 + Math.sin(bp * 0.37) * 0.3 + Math.sin(bp * 2.1) * 0.1;
  let breathNorm = (rawBreath + 1) * 0.5;
  let globalCoupling = COUPLING_MIN + breathNorm * (COUPLING_MAX - COUPLING_MIN);

  // Mouse target phase — slowly rotating so it doesn't create a static spot
  let mouseTargetPhase = (globalTime * 0.02) % (Math.PI * 2);

  // ── Phase update ──────────────────────────────────────────────
  let newPhases = [];
  for (let i = 0; i < cols; i++) {
    newPhases[i] = [];
    for (let j = 0; j < rows; j++) {
      let phase = phases[i][j];
      let dPhase = freqs[i][j];

      // Neighbor coupling
      let cSum = 0, nCount = 0;
      for (let di = -1; di <= 1; di++) {
        for (let dj = -1; dj <= 1; dj++) {
          if (di === 0 && dj === 0) continue;
          let ni = i + di, nj = j + dj;
          if (ni >= 0 && ni < cols && nj >= 0 && nj < rows) {
            cSum += Math.sin(phases[ni][nj] - phase);
            nCount++;
          }
        }
      }

      let coupling = COUPLING_BASE * globalCoupling;

      // Cell position
      let cx = (i - 1) * cellW + cellW * 0.5;
      let cy = (j - 1) * cellH + cellH * 0.5;

      // Mouse: direct phase attraction + extra coupling
      let mdx = cx - smoothMX, mdy = cy - smoothMY;
      let mDist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mDist < MOUSE_RADIUS) {
        let prox = 1 - mDist / MOUSE_RADIUS;
        prox = prox * prox;
        // Pull phase toward the mouse target phase
        dPhase += MOUSE_ATTRACT * prox * Math.sin(mouseTargetPhase - phase);
        // Also boost neighbor coupling
        coupling += MOUSE_COUPLING * prox;
      }

      // Pulse influence — ring of phase reset
      for (let p = 0; p < pulses.length; p++) {
        let pl = pulses[p];
        let pdx = cx - pl.x, pdy = cy - pl.y;
        let pDist = Math.sqrt(pdx * pdx + pdy * pdy);
        let ringDist = Math.abs(pDist - pl.radius);
        if (ringDist < 40) {
          let ringProx = 1 - ringDist / 40;
          // Push phase toward a common value (the pulse "resets" the wavefront)
          dPhase += 0.15 * pl.strength * ringProx * Math.sin(0 - phase);
        }
      }

      if (nCount > 0) dPhase += (coupling / nCount) * cSum;
      dPhase += (Math.random() - 0.5) * NOISE_STRENGTH * 2;

      newPhases[i][j] = (phase + dPhase) % (Math.PI * 2);
      if (newPhases[i][j] < 0) newPhases[i][j] += Math.PI * 2;
    }
  }
  phases = newPhases;

  // ── Render ────────────────────────────────────────────────────
  // Glow pass
  glowBuffer.clear();
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      let brightness = ((Math.sin(phases[i][j]) + 1) * 0.5) * (0.7 + offsets[i][j] * 0.3);
      if (brightness < 0.35) continue;
      let [r, g, b] = cellColor(brightness);
      let sz = 0.5 + brightness * 0.4;
      let w = cellW * sz, h = cellH * sz;
      let x = (i - 1) * cellW + (cellW - w) * 0.5;
      let y = (j - 1) * cellH + (cellH - h) * 0.5;
      glowBuffer.fill(r, g, b);
      glowBuffer.rect(x, y, w, h, Math.min(w, h) * 0.2);
    }
  }

  drawingContext.save();
  drawingContext.filter = 'blur(14px)';
  drawingContext.globalAlpha = 0.3;
  drawingContext.drawImage(glowBuffer.elt, 0, 0);
  drawingContext.restore();

  // Main cells
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      let brightness = ((Math.sin(phases[i][j]) + 1) * 0.5) * (0.7 + offsets[i][j] * 0.3);
      let [r, g, b] = cellColor(brightness);

      // Amber tint near mouse
      let cx = (i - 1) * cellW + cellW * 0.5;
      let cy = (j - 1) * cellH + cellH * 0.5;
      let mdx = cx - smoothMX, mdy = cy - smoothMY;
      let mDist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mDist < MOUSE_RADIUS * 0.7 && brightness > 0.5) {
        let t = (1 - mDist / (MOUSE_RADIUS * 0.7)) * 0.25 * brightness;
        r += (COL_AMBER[0] - r) * t;
        g += (COL_AMBER[1] - g) * t;
        b += (COL_AMBER[2] - b) * t;
      }

      let sz = 0.5 + brightness * 0.4;
      let w = cellW * sz, h = cellH * sz;
      let x = (i - 1) * cellW + (cellW - w) * 0.5;
      let y = (j - 1) * cellH + (cellH - h) * 0.5;

      fill(r, g, b);
      rect(x, y, w, h, Math.min(w, h) * 0.2);
    }
  }
}

function cellColor(brightness) {
  let r, g, b;
  if (brightness < 0.5) {
    let t = brightness * 2; t = t * t;
    r = COL_DIM[0] + (COL_BIO[0] - COL_DIM[0]) * t;
    g = COL_DIM[1] + (COL_BIO[1] - COL_DIM[1]) * t;
    b = COL_DIM[2] + (COL_BIO[2] - COL_DIM[2]) * t;
  } else {
    let t = (brightness - 0.5) * 2;
    r = COL_BIO[0] + (COL_BRIGHT[0] - COL_BIO[0]) * t;
    g = COL_BIO[1] + (COL_BRIGHT[1] - COL_BIO[1]) * t;
    b = COL_BIO[2] + (COL_BRIGHT[2] - COL_BIO[2]) * t;
  }
  return [r, g, b];
}
</script>
</body>
</html>
